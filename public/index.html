<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesGro Media ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ---------------------------------------------------------------------
     BRAND — from DESGRO LOGO BRANDING.pdf: wordmark "DESGRO" (bold, tight
     tracking) + "MEDIA" small-caps below, red bar accent above the D.
     Colors: #000000 / #EB2027 / #FFFFFF. Typeface on file is "Mundial"
     (licensed, TipoType) — not embeddable here; Manrope substitutes for
     body/UI (same geometric-humanist spirit) with IBM Plex Mono for
     tabular figures, matching the numeric convention already in use
     across this ERP's other module builds (Finance Dashboard, People Hub,
     Content Pipeline).
     --------------------------------------------------------------------- */
  :root{
    --paper:#F6F4F3; --surface:#FFFFFF; --surface-sunk:#EFEBEA;
    --sidebar:#0B0808; --sidebar-surface:#171010; --sidebar-line:rgba(255,255,255,.08);
    --sidebar-ink:#B9AEAC; --sidebar-ink-strong:#FFFFFF;
    --ink:#1B1515; --ink-soft:#6B5F5D; --ink-faint:#9C908E; --line:#E3DDDC;
    --brand:#EB2027; --brand-strong:#A8141A; --brand-soft:#FBE3E4;
    --pos:#1F6B45; --pos-soft:#E4F1E9; --neg:#C31A20; --neg-soft:#FBE6E6;
    --warn:#A9781F; --warn-soft:#F3E9D3; --blue:#2A5CDB; --blue-soft:#E7ECFC;
    --shadow: 0 1px 2px rgba(20,16,16,.05), 0 8px 24px -12px rgba(20,16,16,.14);
    --shadow-lg: 0 20px 60px -10px rgba(10,6,6,.35);
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:48px;
    --fs-xs:11px; --fs-sm:12.5px; --fs-base:14px; --fs-md:15.5px; --fs-lg:19px; --fs-xl:25px;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141010; --surface:#1D1717; --surface-sunk:#241D1D;
      --sidebar:#060404; --sidebar-surface:#100B0B; --sidebar-line:rgba(255,255,255,.07);
      --sidebar-ink:#A79C9A; --sidebar-ink-strong:#FBF5F4;
      --ink:#EDE7E6; --ink-soft:#AB9F9D; --ink-faint:#786C6A; --line:#332B2A;
      --brand:#FF4A50; --brand-strong:#EB2027; --brand-soft:rgba(235,32,39,.16);
      --pos:#57B885; --pos-soft:rgba(87,184,133,.14); --neg:#F0787C; --neg-soft:rgba(240,120,124,.14);
      --warn:#D2A24C; --warn-soft:rgba(210,162,76,.14); --blue:#7E9BF2; --blue-soft:rgba(126,155,242,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
      --shadow-lg: 0 20px 60px -10px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141010; --surface:#1D1717; --surface-sunk:#241D1D;
    --sidebar:#060404; --sidebar-surface:#100B0B; --sidebar-line:rgba(255,255,255,.07);
    --sidebar-ink:#A79C9A; --sidebar-ink-strong:#FBF5F4;
    --ink:#EDE7E6; --ink-soft:#AB9F9D; --ink-faint:#786C6A; --line:#332B2A;
    --brand:#FF4A50; --brand-strong:#EB2027; --brand-soft:rgba(235,32,39,.16);
    --pos:#57B885; --pos-soft:rgba(87,184,133,.14); --neg:#F0787C; --neg-soft:rgba(240,120,124,.14);
    --warn:#D2A24C; --warn-soft:rgba(210,162,76,.14); --blue:#7E9BF2; --blue-soft:rgba(126,155,242,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lg: 0 20px 60px -10px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{text-wrap:balance;margin:0;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
  ::selection{background:var(--brand-soft);}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  button{font:inherit;cursor:pointer;}
  input,select,textarea{font:inherit;}
  table{border-collapse:collapse;width:100%;}
  .icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none;}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  .app[hidden]{display:none;}
  .side{background:var(--sidebar);color:var(--sidebar-ink);padding:var(--sp-5) var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-6);position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand-mark{display:flex;flex-direction:column;gap:6px;padding:2px var(--sp-2) 14px;border-bottom:1px solid var(--sidebar-line);}
  .brand-bar{width:34px;height:6px;border-radius:2px;background:linear-gradient(90deg,var(--brand) 0%,#8C0F14 100%);}
  .brand-word{font-weight:800;color:var(--sidebar-ink-strong);font-size:21px;letter-spacing:-.01em;line-height:1;}
  .brand-sub{font-size:10px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.42);text-transform:uppercase;margin-left:1px;}

  .nav-scroll{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--sidebar-ink);border:none;background:transparent;width:100%;text-align:left;}
  .nav-item .icon{width:16px;height:16px;opacity:.85;}
  .nav-item:hover{background:var(--sidebar-line);color:var(--sidebar-ink-strong);}
  .nav-item.active{background:var(--brand);color:#fff;}
  .nav-item.active .icon{opacity:1;}
  .nav-item .count{margin-left:auto;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.16);padding:1px 7px;border-radius:20px;}
  .nav-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 34px;border-left:1px solid var(--sidebar-line);padding-left:12px;}
  .nav-sub .sub-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:12.5px;color:var(--sidebar-ink);opacity:.88;border:none;background:transparent;width:100%;text-align:left;}
  .nav-sub .sub-item:hover{background:var(--sidebar-line);opacity:1;}
  .nav-sub .sub-item.current{color:var(--sidebar-ink-strong);opacity:1;font-weight:700;background:var(--sidebar-line);}
  .nav-sub .sub-item .count{margin-left:auto;font-size:10px;font-weight:800;background:rgba(255,255,255,.16);padding:1px 6px;border-radius:20px;}
  .sidebar-foot{display:flex;align-items:center;gap:10px;padding:10px var(--sp-2) 0;border-top:1px solid var(--sidebar-line);margin-top:6px;}
  .sidebar-foot .who{line-height:1.2;}
  .sidebar-foot .who .name{font-size:12.5px;font-weight:700;color:var(--sidebar-ink-strong);}
  .sidebar-foot .who .role{font-size:10.5px;color:rgba(255,255,255,.45);}

  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:14px 26px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;}
  .topbar-title{display:flex;flex-direction:column;gap:2px;}
  .topbar-title h2{font-size:17px;font-weight:800;}
  .topbar-title span{font-size:var(--fs-xs);color:var(--ink-faint);}
  .topbar-right{display:flex;align-items:center;gap:var(--sp-3);}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface-sunk);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--ink-faint);font-size:var(--fs-sm);width:210px;}
  .search input{background:none;border:none;color:var(--ink);width:100%;outline:none;}
  .search input::placeholder{color:var(--ink-faint);}
  .icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);border:1px solid var(--line);background:var(--surface);flex:none;}
  .avatar{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;}
  .mini-avatar{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none;}

  /* ---------- login gate ---------- */
  .login-screen{position:fixed;inset:0;display:grid;grid-template-columns:1.05fr 1fr;background:var(--paper);z-index:500;}
  .login-screen[hidden]{display:none;}
  .login-brand{background:var(--sidebar);color:var(--sidebar-ink);display:flex;align-items:center;justify-content:center;padding:var(--sp-8);position:relative;overflow:hidden;}
  .login-brand::before{content:"";position:absolute;inset:0;background:radial-gradient(640px 440px at 12% 12%,rgba(235,32,39,.18),transparent 60%);}
  .login-brand-inner{max-width:420px;position:relative;z-index:1;}
  .login-tagline{color:var(--sidebar-ink-strong);font-size:20px;font-weight:600;line-height:1.42;margin:30px 0 0;text-wrap:balance;}
  .login-stats{display:flex;gap:28px;margin-top:36px;}
  .login-stat .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:22px;font-weight:700;color:var(--sidebar-ink-strong);}
  .login-stat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-top:2px;}
  .login-quote{margin-top:40px;padding-top:22px;border-top:1px solid var(--sidebar-line);font-size:13px;color:rgba(255,255,255,.55);line-height:1.65;font-style:italic;}
  .login-panel{display:flex;align-items:center;justify-content:center;padding:var(--sp-6);}
  .login-card{width:100%;max-width:368px;display:flex;flex-direction:column;gap:16px;}
  .login-card-head h1{font-size:25px;}
  .login-card-head p{margin:6px 0 0;color:var(--ink-soft);font-size:13.5px;}
  .field-group{display:flex;flex-direction:column;gap:6px;}
  .login-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;}
  .login-remember{display:flex;align-items:center;gap:7px;color:var(--ink-soft);}
  .login-forgot{color:var(--brand);font-weight:700;text-decoration:none;cursor:pointer;}
  .login-error{background:var(--neg-soft);color:var(--neg);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;}
  .login-submit{width:100%;justify-content:center;padding:11px;font-size:14px;}
  .login-hint{font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.5;}
  @media (max-width:760px){ .login-screen{grid-template-columns:1fr;} .login-brand{display:none;} }
  .mini-avatar.unassigned{background:var(--surface-sunk);color:var(--ink-faint);border:1px dashed var(--line);}
  .mini-avatar.sm{width:20px;height:20px;font-size:9px;}

  .content{padding:24px 26px 48px;display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1220px;margin:0 auto;width:100%;}

  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--brand-soft);border-radius:var(--radius);padding:14px 16px;color:var(--brand-strong);font-size:13px;line-height:1.6;}
  .banner .icon{color:var(--brand-strong);margin-top:1px;}
  .banner b{font-weight:800;}
  .banner.muted{background:var(--surface-sunk);color:var(--ink-soft);}
  .banner.muted .icon{color:var(--ink-soft);}
  .banner.muted b{color:var(--ink);}

  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head h1{font-size:24px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kpi-grid.cols-5{grid-template-columns:repeat(5,1fr);}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-badge{width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand-strong);display:flex;align-items:center;justify-content:center;}
  .kpi-label{font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .kpi-value{font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .kpi-sub{font-size:var(--fs-sm);color:var(--ink-soft);}
  .kpi-card.hero{background:var(--ink);border-color:var(--ink);color:#fff;}
  .kpi-card.hero .kpi-badge{background:rgba(255,255,255,.14);color:#fff;}
  .kpi-card.hero .kpi-label,.kpi-card.hero .kpi-sub{color:rgba(255,255,255,.68);}
  .kpi-value.neg{color:var(--neg);}
  .kpi-value.warn{color:var(--warn);}
  .kpi-value.pos{color:var(--pos);}
  .kpi-value.blue{color:var(--blue);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filter-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-right:2px;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:600;}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .select-sm{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);font-size:12.5px;}

  .btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-strong);}
  .btn.ghost{border-color:transparent;background:var(--surface-sunk);color:var(--ink-soft);}
  .btn.danger{border-color:transparent;background:transparent;color:var(--neg);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .panel-head h3{font-size:var(--fs-md);font-weight:800;}
  .panel-head .sub{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
  .panel-body{padding:16px 18px;}
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:16px;}

  .table-wrap{overflow-x:auto;}
  table.data th{text-align:left;font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.data td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tbody tr:hover{background:var(--surface-sunk);}
  table.data td.num,table.data th.num{text-align:right;}
  table.data tr.total td{font-weight:800;background:var(--surface-sunk);}
  .row-click{cursor:pointer;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);}
  .subtext{font-size:11px;color:var(--ink-faint);margin-top:1px;}

  .person{display:flex;align-items:center;gap:10px;}
  .person-name{font-weight:700;font-size:13.5px;}
  .person-role{font-size:12px;color:var(--ink-soft);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap;border:none;}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .pill.pos{background:var(--pos-soft);color:var(--pos);}
  .pill.warn{background:var(--warn-soft);color:var(--warn);}
  .pill.neg{background:var(--neg-soft);color:var(--neg);}
  .pill.blue{background:var(--blue-soft);color:var(--blue);}
  .pill.neutral{background:var(--surface-sunk);color:var(--ink-soft);}
  button.pill{font-family:inherit;}

  .barchart{display:flex;flex-direction:column;gap:9px;}
  .bar-row{display:grid;grid-template-columns:150px 1fr 28px;align-items:center;gap:10px;}
  .bar-label{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{height:9px;background:var(--surface-sunk);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--brand);border-radius:5px;}
  .bar-val{font-size:12px;font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);text-align:right;}

  .feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .feed-item:last-child{border-bottom:none;padding-bottom:0;}
  .feed-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:var(--brand);}
  .feed-text{font-size:12.5px;}
  .feed-time{font-size:11px;color:var(--ink-faint);margin-top:1px;}
  .empty{padding:30px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}

  /* board / kanban (Marketing → Content) */
  .board-scroll{overflow-x:auto;padding-bottom:8px;}
  .board{display:flex;gap:14px;align-items:flex-start;min-width:max-content;}
  .col{width:258px;flex:none;display:flex;flex-direction:column;background:var(--surface-sunk);border-radius:12px;padding:10px;gap:10px;min-height:120px;}
  .col.drop-hover{outline:2px dashed var(--brand);outline-offset:-2px;}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 0;}
  .col-head .name{font-size:12.5px;font-weight:800;letter-spacing:.02em;}
  .col-head .count{font-size:11px;font-weight:700;color:var(--ink-faint);background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:1px 8px;}
  .col-cards{display:flex;flex-direction:column;gap:8px;min-height:8px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:var(--shadow);}
  .card:active{cursor:grabbing;}
  .card.published{border-color:var(--brand);}
  .card-title{font-size:13px;font-weight:700;line-height:1.4;color:var(--ink);}
  .card-meta{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--surface-sunk);color:var(--ink-soft);}
  .tag .icon{width:11px;height:11px;}
  .tag.type{background:var(--brand-soft);color:var(--brand-strong);}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px;}
  .assignee{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .due{font-size:11px;font-family:"IBM Plex Mono",monospace;color:var(--ink-faint);}
  .due.overdue{color:var(--neg);font-weight:700;}
  .due.published-on{color:var(--pos);font-weight:700;}
  .card-move{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px;}
  .card-move select{flex:1;font-size:11px;padding:5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);}
  .card-edit{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;flex:none;}
  .col-add{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:8px;border:1px dashed var(--line);color:var(--ink-faint);font-size:12px;font-weight:700;justify-content:center;background:transparent;}
  .col-add:hover{border-color:var(--brand);color:var(--brand-strong);background:var(--surface);}

  /* HR calendar */
  .cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:11.5px;color:var(--ink-soft);}
  .cal-legend-item{display:flex;align-items:center;gap:5px;}
  .cal-legend-item .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .cal-legend-item .dot.holiday{background:var(--neg);}
  .cal-legend-item .dot.off{background:var(--ink-faint);}
  .cal-legend-item .dot.birthday{background:var(--blue);}
  .cal-legend-item .dot.anniversary{background:var(--pos);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cal-day{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:4px;transition:border-color .15s;overflow:hidden;}
  .cal-day:hover{border-color:var(--brand);}
  .cal-day.empty{border:none;cursor:default;background:transparent;}
  .cal-day.off{background:var(--surface-sunk);}
  .cal-day.holiday{background:var(--neg-soft);border-color:var(--neg);}
  .cal-day.today{border-color:var(--brand);border-width:2px;}
  .cal-day.today .cal-daynum{color:var(--brand);font-weight:800;}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--ink);}
  .cal-badges{display:flex;flex-direction:column;gap:2px;}
  .cal-badge{font-size:9.5px;font-weight:700;padding:1px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-badge.holiday{background:var(--neg-soft);color:var(--neg);}
  .cal-badge.birthday{background:var(--blue-soft);color:var(--blue);}
  .cal-badge.anniversary{background:var(--pos-soft);color:var(--pos);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,6,6,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
  .overlay[hidden]{display:none;}
  .modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:520px;max-width:100%;max-height:90vh;overflow-y:auto;margin:auto;}
  .modal.wide{width:760px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;}
  .modal-head h3{font-size:15px;font-weight:800;}
  .modal-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none;}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
  .field-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:6px;display:block;}
  .field-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--paper);color:var(--ink);font-size:13.5px;}
  textarea.field-input{resize:vertical;min-height:64px;font-family:inherit;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .check-row{display:flex;flex-wrap:wrap;gap:8px;}
  .check-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .check-chip input{accent-color:var(--brand);}
  .check-chip.checked{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong);}
  .modal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-top:1px solid var(--line);}
  .section-label{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:14px 0 2px;font-weight:700;}
  .section-label:first-child{margin-top:0;}
  .calc-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .calc-line.total{border-bottom:none;border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:800;font-size:14.5px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);z-index:60;display:flex;align-items:center;gap:8px;}
  .toast .icon{color:#fff;}

  .report-details summary{list-style:none;cursor:pointer;}
  .report-details summary::-webkit-details-marker{display:none;}
  .report-line{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;gap:10px;}
  .report-line .chev{width:11px;height:11px;color:var(--ink-faint);transition:transform .12s ease;flex:none;}
  .report-details[open] .report-line .chev{transform:rotate(90deg);}
  .report-line .name{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px;}
  .report-detail{margin:0 4px 10px 21px;border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:5px;}
  .report-detail-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:12px;color:var(--ink-soft);}
  .report-detail-row .amt{white-space:nowrap;}
  .report-subpanel{margin-top:12px;}

  @media (prefers-reduced-motion:no-preference){ .modal{animation:modal-in .15s ease;} }
  @keyframes modal-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (max-width: 1040px){ .app{grid-template-columns:1fr;} .side{display:none;} }
  @media (max-width: 860px){ .kpi-grid,.kpi-grid.cols-5{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .field-row,.field-row.cols-3{grid-template-columns:1fr;} .cal-day{min-height:44px;padding:4px;} .cal-badge{font-size:8px;} .cal-daynum{font-size:10.5px;} }
</style>
</head>
