services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desgro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-desgro_erp}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desgro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-desgro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-desgro_erp}
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env — generate with: openssl rand -hex 32}"
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      # Mail notifications (Brevo SMTP). Blank SMTP_PASS = mail disabled.
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      HR_MAIL_USER: ${HR_MAIL_USER:-hr@desgromedia.com}
      COMPANY_MAIL_USER: ${COMPANY_MAIL_USER:-hr@desgromedia.com}
      # Daily "ad numbers not logged" reminder emails. OFF unless set to true.
      AD_REMINDERS_ENABLED: ${AD_REMINDERS_ENABLED:-false}
      AD_REMINDERS_HOUR: ${AD_REMINDERS_HOUR:-10}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@desgromedia.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!2026}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Uploaded resumes (server/src/config/uploads.ts resolves this same path from inside the
      # container) — without this, a redeploy/restart would silently wipe every resume on file,
      # even though the Candidate rows pointing at them survive fine in Postgres.
      - resumes_data:/app/server/uploads

volumes:
  db_data:
  resumes_data:
